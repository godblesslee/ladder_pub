# === ladder.pub 主页 ===
server {
    server_name ladder.pub www.ladder.pub;

    root /var/www/ladder-pub-home;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    listen 443 ssl;
    ssl_certificate     /etc/letsencrypt/live/www.ladder.pub/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.ladder.pub/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP → HTTPS 重定向
server {
    server_name ladder.pub www.ladder.pub;
    listen 80;
    return 301 https://ladder.pub$request_uri;
}

# === testingapp.ladder.pub 应用 ===
server {
    server_name testingapp.ladder.pub;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl;
    ssl_certificate     /etc/letsencrypt/live/testingapp.ladder.pub/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/testingapp.ladder.pub/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP → HTTPS
server {
    server_name testingapp.ladder.pub;
    listen 80;
    return 301 https://testingapp.ladder.pub$request_uri;
}